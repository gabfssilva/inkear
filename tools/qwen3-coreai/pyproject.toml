[project]
name = "qwen3-coreai"
version = "0.1.0"
description = "Converts Qwen3-TTS 12Hz 0.6B to Core AI models for the Neural Engine"
requires-python = ">=3.12,<3.13"
dependencies = ["coreai-torch==0.4.3", "qwen3-coreml"]

[project.scripts]
qwen3-coreai-convert = "qwen3_coreai.convert:main"

[dependency-groups]
dev = ["ruff==0.17.0"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
# coreai-torch needs torch 2.8 or later and numpy 2.3 or later; qwen3-coreml pins the versions
# coremltools 9.0 converts with.
override-dependencies = ["torch==2.14.1", "torchaudio==2.11.0", "numpy==2.4.6"]

[tool.uv.sources]
qwen3-coreml = { path = "../qwen3-coreml", editable = true }

[tool.ruff]
line-length = 110
