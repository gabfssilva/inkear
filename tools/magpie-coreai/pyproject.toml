[project]
name = "magpie-coreai"
version = "0.1.0"
description = "Converts Magpie TTS Multilingual 357M to Core AI models for the Neural Engine"
requires-python = ">=3.12,<3.13"
dependencies = ["coreai-torch==0.4.3", "magpie-coreml @ file:///${PROJECT_ROOT}/../magpie-coreml"]

[project.scripts]
magpie-coreai-convert = "magpie_coreai.convert:main"

[dependency-groups]
dev = ["ruff==0.17.0"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
# coreai-torch needs torch 2.8 or later and numpy 2.3 or later; magpie-coreml pins the versions
# coremltools 9.0 converts with. NeMo pins CUDA torch wheels through its own sources.
override-dependencies = ["torch==2.14.1", "torchaudio==2.11.0", "numpy==2.4.6"]
no-sources = true

[tool.ruff]
line-length = 110
