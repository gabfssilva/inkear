[project]
name = "chatterbox-coreml"
version = "0.1.0"
description = "Converts the Chatterbox Multilingual V3 pt-BR pack to Core ML for the Neural Engine and checks it against the PyTorch reference"
requires-python = ">=3.13,<3.14"
dependencies = [
    "coremltools==9.0",
    "conformer==0.3.2",
    "diffusers==0.29.0",
    "einops==0.8.1",
    "huggingface-hub==0.25.2",
    "librosa==0.11.0",
    "mlx-whisper==0.4.2",
    "numpy==2.2.6",
    "omegaconf==2.3.0",
    "resemble-perth==1.0.1",
    "s3tokenizer==0.2.0",
    "safetensors==0.5.3",
    "scipy==1.17.1",
    "setuptools<81",
    "soundfile==0.13.1",
    "tokenizers==0.20.3",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "transformers==4.46.3",
]

[project.scripts]
chatterbox-convert = "chatterbox_coreml.convert:main"
chatterbox-report = "chatterbox_coreml.report:main"

[dependency-groups]
dev = ["ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
