[project]
name = "coreai-aot"
version = "0.1.0"
description = "Compiles a Core AI model ahead of time for the Neural Engine of each iOS architecture"
requires-python = ">=3.13,<3.14"
dependencies = ["huggingface-hub==2.2.0"]

[project.scripts]
coreai-aot = "coreai_aot:main"

[dependency-groups]
dev = ["ruff==0.17.0"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
